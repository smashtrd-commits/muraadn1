<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="candlegreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="candlered" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Candlestick 1: Bullish -->
  <line x1="160" y1="130" x2="160" y2="380" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
  <rect x="140" y="190" width="40" height="130" rx="8" fill="white" />

  <!-- Candlestick 2: Bearish / Middle -->
  <line x1="256" y1="90" x2="256" y2="420" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" />
  <rect x="236" y="150" width="40" height="190" rx="8" fill="#60a5fa" />

  <!-- Candlestick 3: Bullish / Breakout -->
  <line x1="352" y1="110" x2="352" y2="390" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
  <rect x="332" y="170" width="40" height="150" rx="8" fill="white" />
</svg>
